[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ringrouter"
version = "0.1.0"
description = "Voice-command router for Pebble Index 01 ring transcripts"
requires-python = ">=3.11"
# Standard library only. Secrets come from a git-ignored .env file.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ring-router = "ringrouter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: uses the real on-device model (/usr/bin/fm)"]
