# Test phrases: what you might say to the ring, and how it must route.
# Used by tests/test_phrases.py (routing only, no side effects) and by
#   ring-router sim --file tests/phrases.toml     (end-to-end against the running server)
# Only the keys listed in a case are checked.
#   extracted = text the router pulls out after the prefix (before any rewrite)
#   sends     = exact message that goes out (after the on-device "ask" rewrite);
#               a list means any of these wordings is acceptable. Checked by
#               tests/test_messages_live.py, which runs the real /usr/bin/fm model.

# ---------------------------------------------------------------- messaging --
[[case]]
say = "Tell Terri I'm on my way."
sends = "I'm on my way."
route = "imessage"
recipient = "terri"
tier = "strong"
rewrite = "none"
extracted = "I'm on my way."

