# ring-router configuration. Copy to config.toml (git-ignored) and edit.
# Secrets (path token, signing secret, API keys) are NOT stored here: they live in
# the git-ignored .env file (mode 600). See `ring-router init` and .env.example.

[server]
host = "127.0.0.1"          # never bind publicly; the tunnel forwards to this
port = 8642
public_url = "https://your-mac.your-tailnet.ts.net"   # Tailscale Funnel address: buttons and answer pages use it
dry_run = true              # global: nothing is sent or changed while true
dry_run_routes = []         # routes kept in dry run even when dry_run = false
state_dir = "~/Library/Application Support/ring-router"
timestamp_window_s = 300
max_recording_age_s = 300   # a message or home command spoken longer ago than this asks "Run it now?" (0 = off)
retention_days = 90         # activity, traces, saved answers and conversations older than this are deleted

[notify]
provider = "console"        # "console" (log only) or "pushcut"
max_chars = 300             # longer answers get a "Full answer" button
pushcut_notification = "Ring Router"   # name of the Pushcut notification to trigger

[fm]
path = "/usr/bin/fm"
timeout_s = 15

[macos_mcp]
# Command that starts the mcp-macos server over stdio. Uses the router's own pinned copy in
# vendor/ (see README: npm blocks the install script that compiles its EventKit helper).
command = ["/opt/homebrew/bin/node", "vendor/node_modules/mcp-macos/bin/run.cjs"]

# ---------------------------------------------------------------- recipients --
# The allowlist. Nobody else can be messaged.
# sounds_like: spellings speech-to-text may produce (matched as strong).
# bare = true allows "Instinct, ..." with no ask/tell verb in front.
# Where a message goes: `handle` (a phone number or email, recommended: it can't change under you),
# or else the one Contacts card named in `contact` (its mobile number, else first phone, else
# email). If no card or more than one card has that name, nothing is sent.

[recipients.terri]
display = "Terri"
pronoun = "her"                      # "tell her ..." right after messaging Terri goes to Terri (she/he/they)
contact = "Terri Lastname"           # Contacts card name
# handle = "+15555550100"
sounds_like = ["terri", "terry", "teri", "tari", "tery", "terrie"]

[recipients.instinct]
display = "Instinct"
contact = "Instinct"
sounds_like = ["instinct", "in stinct", "instink"]
bare = true

# A group chat (chat_id) is "them" without saying so.
[recipients.the_guys]
display = "the guys"
chat_id = "any;+;chat000000000000000000"   # Messages chat ID of the group
sounds_like = ["the guys"]

# -------------------------------------------------------------------- models --
# Spoken names -> OpenRouter model IDs (https://openrouter.ai/models).
# web_search = false on a model turns off web search for its "ask" route.

[models.chatgpt]
display = "ChatGPT"
spoken = ["chatgpt", "chat gpt", "chat g p t", "chat"]
model = "openai/gpt-6.1-terra"

[models.claude]
display = "Claude"
spoken = ["claude", "clod", "cloud"]
model = "anthropic/claude-sonnet-5.5"

[models.deepseek]
display = "DeepSeek"
spoken = ["deepseek", "deep seek"]
model = "deepseek/deepseek-v4.1-flash"

[models.qwen]
display = "Qwen"
spoken = ["qwen", "quen", "kwen", "queen"]
model = "qwen/qwen3.8-flash"

[openrouter]
web_search_ask = true        # "ask <model>" questions get live web results (~$0.005/question)
web_results_ask = 3
followup_window_s = 600      # a question to the same model within 10 min continues that conversation

[agents]
# The general agent handles every unmatched command. Needs a model that's good at tool calls.
model = "anthropic/claude-sonnet-5.5"
read_messages = false   # let the agent read (never send) Messages; needs Full Disk Access
web_search_model = "deepseek/deepseek-v4.1-flash"   # backs the agents' web_search tool
web_results = 5
confirm_rerouted_messages = true   # a message the agent picks out of background noise needs a Send tap
confirm_rerouted_home = ["unlock", "open"]   # so do these home actions when they come through the agent
                                             # (said as a plain command, they just run)
require_write_intent = true   # the agent may update/delete only if your words asked for a change
max_deletes = 1               # deletes the agent may make per request
max_requests = 12             # model calls one request may use before the agent is stopped
home_tools = true             # the agent may read device state and control devices you ask it to
max_home_actions = 5          # device actions the agent may take per request

[research]
web_results = 8
default_model = "chatgpt"
notes_folder = "Research"

# --------------------------------------------------------------------- hosts --
# Claude Code targets: "ask Claude Code on <host> ..." or "ask Claude on <host> ..." (naming a host
# is what makes it Claude Code; "ask Claude ..." alone is the OpenRouter model). ssh = "" runs locally.
# Per host, optional: claude (CLI path, or a command that reaches it, e.g. "sudo docker exec -i
# claude-code claude" for Claude Code in a container), read_tools / change_tools, allow_changes = false, model,
# not_ready = "why" (answers "isn't set up yet: why" instead of trying).

[claude_code]
claude = "claude"                    # the CLI on each host (it must be logged in there)
ssh_identity = ""                    # a dedicated key, e.g. "~/.ssh/ring-router_ed25519" (no agent prompts)
timeout_s = 900                      # one run's limit
max_turns = 30
followup_window_s = 900              # follow-ups resume the session; Proceed / "go ahead" valid this long
billing = "subscription"             # how the CLI is logged in: "subscription" (claude.ai; its cost figure is
                                     # only an API-price estimate) or "api" (API key: the cost is real)

[hosts.mac_mini]
display = "Mac mini"
spoken = ["mac mini", "the mac mini", "the mac", "local"]
ssh = ""
workdir = "~"
default = true

[hosts.truenas]
display = "TrueNAS"
spoken = ["truenas", "true nas", "the nas", "nas", "the home server", "home server"]
ssh = "truenas"
workdir = "~"

[hosts.racknerd]
display = "RackNerd VPS"
spoken = ["racknerd vps", "rack nerd vps", "racknerd", "rack nerd", "old vps", "the old vps", "vps 1", "vps one", "vps1"]
ssh = "racknerd"
workdir = "~"

[hosts.contabo]
display = "Contabo VPS"
spoken = ["contabo vps", "contabo", "new vps", "the new vps", "vps 2", "vps two", "vps2", "linger.dev vps", "linger dev vps"]
ssh = "contabo"
workdir = "~"

# --------------------------------------------------------------------- lists --

[lists.shopping]
reminders_list = "Shopping list"
spoken = ["shopping list", "grocery list", "groceries list", "groceries", "shopping"]

# ---------------------------------------------------------------- reminders --

[reminders]
# "Remind me when I get home / when I leave": home = the address on your Contacts "My Card",
# read fresh each time (geocoded by Apple); the geofence syncs to your iPhone via iCloud.
# Other places are listed under [places]. "When I leave here" is refused: there's no access to
# your location, so "here" can't be known.
geofence_radius_m = 100
# georeminder = "build/georeminder"   # helper binary (built by helpers/georeminder/build.sh)

# -------------------------------------------------------------------- places --
# Places for "remind me when I get to the gym / when I leave work". Home is built in (My Card).
# An unknown place is refused, never guessed. Give one of: address, lat + lon, or contact_label
# (an address on your Contacts My Card with that label, e.g. "work").
# [places.gym]
# name = "Gym"
# spoken = ["the gym", "gym"]          # "the"/"my" in front is always allowed
# address = "1 Fitness Way, Town, ST 12345"
# radius_m = 150                       # optional; default [reminders] geofence_radius_m
#
# [places.work]
# spoken = ["work", "the office", "my office"]
# contact_label = "work"

# ------------------------------------------------------------------ messages --
[messages]
# "Tell her ..." / "let him know ..." means whoever you messaged last, for this long. A pronoun that
# matches that recipient's `pronoun` sends; one that doesn't (or none set) asks with a Send tap.
followup_window_s = 600

# ----------------------------------------------------------------- calendars --

[calendars]
sources = ["iCloud"]        # only these accounts' calendars (hides the Google copies calsync mirrors)
default_minutes = 60        # length of an event when no end time is said
default = "CHANGE-ME"        # what "my calendar" means, e.g. "Dave"
# aliases: spoken name (before the word "calendar") -> Calendar name
aliases = { "our" = "Shared", "shared" = "Shared", "work" = "Work", "my work" = "Work" }

# -------------------------------------------------------------------- notes --

[notes]
default_folder = "Notes"
remember_folder = "Remember"

# --------------------------------------------------------------------- home --

[hubitat]
enabled = false             # optional module; HomeKit handles everything when off
host = "192.168.1.10"          # hub's local IP
app_id = "CHANGE-ME"           # Maker API app ID; token is RING_ROUTER_HUBITAT_TOKEN in .env
exclude = []                  # same as [home] exclude (kept for older configs)
# aliases / prefer here still work (older configs); [home] is the place for them now

[homekit]
# HomeMCPBridge (patched build, see vendor/patches/). Every HomeKit device: lights, fans and speeds,
# locks, garage doors. With [hubitat] enabled, devices whose manufacturer is Hubitat are bridged
# duplicates and stay on the Maker API.
command = ["vendor/HomeMCPBridge/build/Build/Products/Release-maccatalyst/HomeMCPBridge.app/Contents/MacOS/HomeMCPBridge"]
homes = ["primary"]            # HomeKit homes to use ("primary" = your primary home)
exclude_rooms = []      # rooms never controlled (e.g. cameras for another house)

[home]
# Actions that need a Pushcut Send/Cancel tap before they run. Empty = everything runs as
# spoken (the ring only listens while you hold the button). e.g. ["unlock", "open"]
confirm_actions = []
# Device names never to control, on either backend. Anything named a detector, alarm or siren is
# always left alone, and "turn off everything" skips outlets and plugs without listing them here.
exclude = []
# Spoken nickname -> exact device label, on either backend (for names the matcher can't guess, or a
# device whose HomeKit name differs from what you say). The nickname is the whole spoken target.
aliases = { "back door" = "Back Door Lock" }
# Spoken room name -> the room's real name, anywhere in a phrase ("guest bedroom fan" -> Guest Room).
room_aliases = { }
prefer = ["ceiling fan"]       # tie-breaker when a name matches several devices
# Read-back: after lock / unlock / open / close, ask the device what state it ended up in and say
# so ("Front Door locked (confirmed)", or "was told to lock but reports unlocked"). Off by default:
# it makes the command wait for the device (a garage door takes ~15 s) before it answers.
read_back = false
read_back_timeout_s = 20      # how long to wait for the device to get there
read_back_every_s = 2         # how often to look while waiting

# -------------------------------------------------------------------- scenes --
# Exact phrase only: the whole transcript must equal one of the phrases.

[scenes.goodnight]
phrases = ["goodnight", "good night"]
actions = []   # e.g. [{ device = "living room light", action = "off" }]

[scenes.leaving]
phrases = ["i'm leaving", "im leaving", "leaving now", "i'm leaving now"]
actions = []

# -------------------------------------------------------------------- cancel --

[cancel]
strong = ["cancel cancel", "cancel that", "scrap that", "never mind", "nevermind",
          "ignore me", "ignore that", "abort", "abort abort", "disregard that"]
weak = ["forget that", "forget it", "don't do that", "do not do that", "stop", "cancel"]

# ------------------------------------------------------------------- refusals --

[refuse.timers]
patterns = ['\bset (a|an|the)? ?(timer|alarm)\b', '\b(start|create) (a|an)? ?timer\b',
            '\btimer for\b', '^\w+ timer\b', '\bwake me( up)?\b', '\balarm for\b',
            '\b\d+ ?(second|minute|hour)s? timer\b']
message = "Timers and alarms aren't supported from the ring."
